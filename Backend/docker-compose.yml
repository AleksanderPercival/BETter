services:
  postgres:
    image: postgres:17-alpine
    container_name: better-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: better
      POSTGRES_USER: better
      POSTGRES_PASSWORD: better
    ports:
      - "5432:5432"
    volumes:
      - better_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U better -d better"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  better_postgres_data:
